appId: dev.walkcache.checkout
---
- launchApp:
    clearState: true
- assertVisible:
    id: "screen_login"
- assertVisible: "WalkCache Shop"
- tapOn:
    id: "username_input"
- inputText: "qa@walkcache.dev"
- tapOn:
    id: "password_input"
- inputText: "testing123"
- hideKeyboard
- tapOn:
    id: "login_button"
- assertVisible:
    id: "screen_catalog"
- assertVisible: "Mochi sticker pack"
- assertVisible: "$5.00 · 6 stickers"
- tapOn:
    id: "add_to_cart"
- assertVisible:
    id: "screen_cart"
- assertVisible: "1 × Mochi sticker pack"
- assertVisible: "Total: $5.00"
- tapOn:
    id: "checkout_button"
- assertVisible:
    id: "order_confirmation"
- assertVisible: "Order confirmed"
- assertVisible:
    id: "screen_confirmation"
- assertVisible: "Order #WC-1001 · Mochi sticker pack"
