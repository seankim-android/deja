name: Release

# Cut only when Sean asks (docs/RELEASING.md). Never runs on pull requests or pushes to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve and verify release tag commit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
      version: ${{ steps.pin.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin tag commit on main and verify Cargo.toml version
        id: pin
        run: |
          commit_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit_sha" FETCH_HEAD; then
            echo "$RELEASE_TAG ($commit_sha) is not an ancestor of origin/main" >&2
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml workspace version $version" >&2
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build native ${{ matrix.artifact_target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_target: darwin-arm64
          # Declared Linux release baseline: Ubuntu 22.04 (glibc >= 2.35).
          # DEJA-70 will finalize behavioral smoke checks and evaluate static musl builds.
          - os: ubuntu-22.04
            artifact_target: linux-x64
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Validate tracked artifacts and unchanged checkout
        run: cargo run --locked --bin deja-repo-check -- --require-clean --check-chart
      - name: Build release binary
        run: cargo build --locked --release --bin deja
      - name: Stage and smoke-check binary on clean PATH
        run: |
          mkdir -p dist-bin
          out="dist-bin/deja-${VERSION}-${{ matrix.artifact_target }}"
          cp target/release/deja "$out"
          chmod +x "$out"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" --version
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" --help >/dev/null
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" guide >/dev/null
      - name: Require full behavioral release smoke gate (DEJA-65 / DEJA-70)
        run: |
          echo "Release blocked: full clean-PATH behavioral smoke tests (remember + warm run + gate + deja-summary v=1) are tracked in DEJA-65 and DEJA-70." >&2
          echo "Regular releases stay fail-closed until DEJA-70 replaces this gate with an end-to-end deterministic CLI fixture check." >&2
          exit 1
      - name: Upload built binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: deja-${{ matrix.artifact_target }}
          path: dist-bin/deja-${{ env.VERSION }}-${{ matrix.artifact_target }}

  release:
    name: Draft GitHub release
    needs: [resolve, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PINNED_SHA: ${{ needs.resolve.outputs.commit_sha }}
    steps:
      - name: Check out pinned commit and verify tag did not move
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag still points to pinned commit
        run: |
          git fetch --no-tags --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          current_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          if [ "$current_sha" != "$PINNED_SHA" ]; then
            echo "Tag $RELEASE_TAG moved during build (expected $PINNED_SHA, got $current_sha)" >&2
            exit 1
          fi
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: |
          cd dist-bin
          chmod +x deja-*
          sha256sum deja-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft --verify-tag \
            --title "deja ${RELEASE_TAG#v}" \
            --notes "Standalone native Rust deja binaries (built from ${PINNED_SHA}). Verify with SHA256SUMS. See docs/RELEASING.md." \
            dist-bin/deja-* dist-bin/SHA256SUMS
