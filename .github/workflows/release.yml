name: Release

# Cut only when Sean asks (docs/RELEASING.md). Never runs on pull requests or pushes to main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build native ${{ matrix.artifact_target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_target: darwin-arm64
          - os: ubuntu-latest
            artifact_target: linux-x64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "$RELEASE_TAG is not an ancestor of origin/main" >&2
            exit 1
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check the tag matches workspace Cargo.toml version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml workspace version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Validate tracked artifacts and unchanged checkout
        run: cargo run --locked --bin deja-repo-check -- --require-clean --check-chart
      - name: Build release binary
        run: cargo build --locked --release --bin deja
      - name: Stage and smoke-check binary on clean PATH
        run: |
          mkdir -p dist-bin
          out="dist-bin/deja-${VERSION}-${{ matrix.artifact_target }}"
          cp target/release/deja "$out"
          chmod +x "$out"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" --version
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" --help >/dev/null
          env -i PATH=/usr/bin:/bin HOME="$HOME" "$out" guide >/dev/null
      - name: Upload built binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: deja-${{ matrix.artifact_target }}
          path: dist-bin/deja-${{ env.VERSION }}-${{ matrix.artifact_target }}

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true
      - name: Compute SHA256SUMS
        run: |
          cd dist-bin
          chmod +x deja-*
          sha256sum deja-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft --verify-tag \
            --title "deja ${RELEASE_TAG#v}" \
            --notes "Standalone native Rust deja binaries. Verify with SHA256SUMS. See docs/RELEASING.md." \
            dist-bin/deja-* dist-bin/SHA256SUMS
