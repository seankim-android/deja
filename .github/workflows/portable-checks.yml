name: Portable checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Linux / no device or model
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Unit and integration-contract tests
        run: bun test --timeout=10000
      - name: TypeScript and production viewer build
        run: bun run build
      - name: Build, pack and install every package
        run: bun scripts/pack-check.ts
      - name: Validate tracked artifacts and unchanged checkout
        run: bun scripts/validate-release-artifacts.ts
      - name: Confirm tested revision
        run: git rev-parse HEAD
